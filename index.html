<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thrift Flip</title>
  <meta name="description" content="Thrift Flip: scrub, sand, and polish yard-sale junk into treasure, then haggle for profit.">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <img src="icon.png" alt="">
      <a class="brand" href="./">Thrift Flip</a>
    </div>
  </header>
  <main>
    <section class="card hero">
      <img class="feature" src="feature.png" alt="A dusty, rusted brass lamp next to the same lamp restored and gleaming.">
      <h1>Restore junk. Find treasure. Flip it.</h1>
      <p>Buy mystery boxes at the yard sale, scrub and polish every item by hand, find what's hidden inside, and haggle it into profit.</p>
      <p><span class="pill">Coming soon to Google Play</span></p>
      <div class="buttons">
        <a class="button purple" href="privacy/">Privacy policy</a>
      </div>
    </section>
  </main>
  <footer>Thrift Flip</footer>
</body>
</html>
